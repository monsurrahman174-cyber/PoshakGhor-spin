<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoshakGhor Spin & Win</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:linear-gradient(135deg,#fff7ed,#eaf3ff);
color:#172033;
}

.container{
max-width:620px;
margin:auto;
padding:10px;
}

.header{
background:#062d63;
color:white;
text-align:center;
padding:20px 12px;
border-radius:0 0 25px 25px;
box-shadow:0 6px 20px #0003;
}

.logo{
font-size:32px;
font-weight:900;
}

.logo span{
color:#ffd21f;
}

.title{
font-size:25px;
font-weight:900;
color:#ffd21f;
line-height:1.3;
margin-top:10px;
}

.title span{
color:white;
}

.subtitle{
font-size:14px;
margin-top:6px;
}

.card{
background:white;
margin-top:14px;
padding:12px;
border-radius:25px;
box-shadow:0 8px 25px #0002;
}

/* WHEEL */

.wheel-area{
position:relative;
width:min(96vw,560px);
aspect-ratio:1;
margin:auto;
}

.wheel{
position:absolute;
inset:3%;
border-radius:50%;
overflow:hidden;
border:8px solid white;
box-shadow:0 10px 35px #0004;

transition:
transform 4.8s cubic-bezier(.12,.72,.1,1);
}

canvas{
width:100%;
height:100%;
display:block;
}

.pointer{
position:absolute;
z-index:5;
top:-2px;
left:50%;
transform:translateX(-50%);

width:0;
height:0;

border-left:19px solid transparent;
border-right:19px solid transparent;
border-top:45px solid #111;

filter:drop-shadow(0 3px 2px #0005);
}

/* SPIN BUTTON */

.spin{
display:block;
width:92%;
margin:8px auto;

padding:17px;

border:none;
border-radius:18px;

background:linear-gradient(
180deg,
#ff493d,
#dc1f1f
);

color:white;

font-size:23px;
font-weight:900;

box-shadow:
0 8px 20px #dc1f1f55;

cursor:pointer;
}

.spin:disabled{
opacity:.5;
}

/* RESULT */

.result{
margin:10px auto;

padding:14px;

text-align:center;

border:2px dashed #16a34a;

background:#f0fdf4;

border-radius:17px;

font-size:20px;
font-weight:900;

color:#166534;

min-height:55px;
}

/* ADMIN */

.admin-button{
border:none;

background:#eef4ff;

color:#123d78;

padding:11px 15px;

border-radius:12px;

font-weight:800;
}

.admin-panel{
display:none;
margin-top:15px;
}

.admin-panel.open{
display:block;
}

.grid{
display:grid;

grid-template-columns:
1fr 90px 70px;

gap:6px;

align-items:center;

font-size:14px;
}

.grid input{
width:100%;

padding:8px;

border:
1px solid #ccd5e2;

border-radius:9px;
}

.row{
padding:7px 0;

border-bottom:
1px solid #eee;
}

.save{
margin-top:12px;

border:none;

background:#16a34a;

color:white;

padding:11px 20px;

border-radius:10px;

font-weight:800;
}

.reset{
margin-top:12px;

border:none;

background:#64748b;

color:white;

padding:11px 20px;

border-radius:10px;

font-weight:800;
}

.info{
margin-top:12px;

background:#062d63;

color:white;

padding:14px;

border-radius:17px;

font-size:13px;

line-height:1.7;
}

/* POPUP */

.modal{
position:fixed;

inset:0;

background:#0009;

display:none;

align-items:center;

justify-content:center;

padding:20px;

z-index:100;
}

.modal.show{
display:flex;
}

.popup{
background:white;

width:min(400px,100%);

border-radius:27px;

padding:28px 18px;

text-align:center;

box-shadow:
0 20px 60px #0006;

animation:
pop .3s ease;
}

@keyframes pop{

from{
transform:scale(.7);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

.gift{
font-size:65px;
}

.congratulations{
font-size:30px;

font-weight:900;

color:#16a34a;
}

.prize{
font-size:24px;

font-weight:900;

color:#123d78;

margin:12px;
}

.ok{
border:none;

background:#16a34a;

color:white;

padding:12px 35px;

border-radius:12px;

font-size:17px;

font-weight:900;
}

.footer{
text-align:center;

font-size:12px;

color:#64748b;

margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<header class="header">

<div class="logo">
🛍️ Poshak<span>Ghor</span>
</div>

<div class="title">

৬৫০ টাকার শপিং করো

<br>

<span>
আর স্পিন করে পুরস্কার লুফে নাও!
</span>

</div>

<div class="subtitle">
শপিং • স্পিন • পুরস্কার 🎁
</div>

</header>


<div class="card">

<div class="wheel-area">

<div
class="wheel"
id="wheel"
>

<canvas
id="wheelCanvas"
width="900"
height="900">
</canvas>

</div>

<div class="pointer"></div>

</div>


<button
class="spin"
id="spinButton"
>

🎡 SPIN করুন

</button>


<div
class="result"
id="result"
>

চাকা ঘুরিয়ে আপনার পুরস্কার দেখুন 🎉

</div>

</div>


<!-- ADMIN -->

<div class="card">

<button
class="admin-button"
id="adminButton"
>

⚙️ Admin Control

</button>


<div
class="admin-panel"
id="adminPanel"
>

<p>

<b>
পুরস্কারের সর্বোচ্চ সংখ্যা নিয়ন্ত্রণ করুন
</b>

</p>


<div
class="grid"
id="adminRows"
>

<div><b>পুরস্কার</b></div>

<div><b>সীমা</b></div>

<div><b>দেওয়া</b></div>

</div>


<button
class="save"
id="saveButton"
>

💾 সংরক্ষণ

</button>


<button
class="reset"
id="resetButton"
>

↺ ডিফল্ট

</button>


<p
style="
font-size:12px;
color:#777;
"
>

এই ডেমোতে পুরস্কারের হিসাব
এই ব্রাউজারের Local Storage-এ
সংরক্ষণ করা হয়।

</p>

</div>

</div>
